<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            height: 100vh;
            width: 100vw;
        }
        .container{

            height: 100%;
            width: 100%;
            background-color:rgb(44, 44, 84);
            padding: 4rem;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,fr);
            gap: 2rem;
            /* grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); */
        }
        .box{
           
            
            border: 4px solid black;
            
        }
        .box1{
            background-color: #cf2d22;

        }
        .box2{
            background-color: #cd6a0e;

        }
        .box3{
            background-color: #c3a108;

        }
        .box4{
            background-color: #13ba34;

        }
        .box5{
            background-color: #19da9d;

        }
        .box6{
            background-color: #09a246;

        }
      

    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
            <div class="box box4"></div>
            <div class="box box5"></div>
            <div class="box box6"></div>

        </div>
    </main>
</body>
</html>
