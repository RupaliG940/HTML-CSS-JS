<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            height: 100vh;
            width: 100vw;
            
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #837f7f;
            display: grid;
            grid-template-columns:repeat(3,1fr) ;
            grid-template-rows: repeat(3,1fr);
            padding: 2rem;
            gap: 2rem;

        }
        .item{

            border: 5px solid black;
            background-color: pink;
        }
       
        .box1,.box4{
            
            grid-column-start: 1;
            grid-column-end: 4;
        
        }
        .box3{
            grid-column-start: 2;
            grid-column-end: 4;
            
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item box1"></div>
            <div class="item box2"></div>
            <div class="item box3 "></div>
             <div class="item box4"></div>
        </div>
    </main>
</body>
</html>
