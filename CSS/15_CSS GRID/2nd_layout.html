<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd layout</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            height: 100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #392570;
            padding:2rem;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,1fr);
            gap: 2rem;
            
        }
        .box{
            display: grid;
            border: 5px solid black;
            gap: 2rem;

        }
        .box1{
            background-color: #d2c815;
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;

        }
        .box2{
            background-color: #14971a;
            grid-column-start: 2;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 3;
            
           
        }


        
        .box3{
            background-color: #23d1e4;
            grid-column-start: 1;
            grid-column-start: 2;
            grid-row-start: 2;
            grid-row-end: 3;
            
           
        }
        .box4{
            background-color: #ed55ce;
            grid-column-start: 2;
            grid-column-start: 3;
            grid-row-start: 2;
            grid-row-end: 3;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="box box1">  </div>
            <div class="box box2"></div>
            <div class="box box3"></div>
            <div class="box box4"></div>
        </div>

    </main>
</body>
</html>
