<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4th layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            height: 100vh;
            width: 100vw;
            
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #635b5b;
            border: 5px soild black;
            display: grid;
            gap: 2rem;
            padding: 2rem;
            grid-template-columns: repeat(6,1fr);
            grid-template-rows: repeat(8,1fr);

        }
        .item{
            border: 2px solid black;
            background-color: pink;
        }
        .box1{
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 3;
        }
        .box2{
            grid-column-start: 4;
            grid-column-end: 8;
            grid-row-start: 1;
            grid-row-end: 3;
        }
        .box3{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 3;
            grid-row-end: 8;
        }
        .box4{
            grid-column-start: 3;
            grid-column-end: 8;
            grid-row-start: 3;
            grid-row-end: 8;

        }
        .box5{
            grid-column-start: 1;
            grid-column-end: 8;
            grid-row-start: 8;
            grid-row-end: 9;

        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item box1"></div>
            <div class="item box2"></div>
            <div class="item box3"></div>
            <div class="item box4"></div>
            <div class="item box5"></div>
        </div>
    </main>
</body>
</html>
