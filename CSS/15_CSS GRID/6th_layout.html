<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6th layout</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            height: 100vh;
            width: 100vw;
            
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #635b5b;
            border: 3px soild black;
            display: grid;
            gap: 1rem;
            padding: 2rem;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(5,1fr);


        }
        .item{
            border: 3px solid black;
            background-color: pink;
        }
        .box1{
            grid-column-start: 1;
            grid-column-end: 3;
        }
        
        .box7{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 3;
            grid-row-end: 5;
        }
        .box8{
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 3;
            grid-row-end: 4;
        }
        .box9{
            grid-column-start: 4;
            grid-column-end: 5;
            grid-row-start: 3;
            grid-row-end: 4;
        }
        .box10{
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 4;
            grid-row-end: 5;
        }
       

        .box11{
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 5;
            grid-row-end: 6;
        }
        .box12{
            grid-column-start: 4;
            grid-column-end: 5;
            grid-row-start: 5;
            grid-row-end: 6;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item box1"></div>
            <div class="item box2"></div>
            <div class="item box3"></div>
            <div class="item box4"></div>
            <div class="item box5"></div>
            <div class="item box6"></div>
            <div class="item box7"></div>
            <div class="item box8"></div>
            <div class="item box9"></div>
            <div class="item box10"></div>
            <div class="item box11"></div>
            <div class="item box12"></div>
        </div>
    </main>
</body>
</html>
