<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9th layout</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            height: 100vh;
            width: 100vw;
            
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #e4b8df;
            border: 5px soild black;
            display: grid;
            gap: 1.5rem;
            padding: 2rem;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(5,1fr);

        }
        .item{
            border: 4px solid black;
            background-color: rgb(189, 68, 88);
        }
        .box1{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        .box2{
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 2;
            grid-row-end: 6;
        }
        .box3{
            grid-column-start: 2;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .box4,.box5{
            /* grid-column-start: 2;
            grid-column-end: 3; */
            grid-row-start: 4;
            grid-row-end: 6;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item  box1"></div>
            <div class="item box2"></div>
            <div class="item box3"></div>
            <div class="item box4"></div>
            <div class="item box5"></div>
            
        </div>
    </main>
</body>
</html>
