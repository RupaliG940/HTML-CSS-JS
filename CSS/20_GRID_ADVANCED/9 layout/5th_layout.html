<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #4d4b4b;
            padding: 2rem;
            gap: 1rem;
            display: grid;
            grid-template-areas: 
                "box1 box2 box3 box4 box5 box6"
                "box7 box8 box9 box10 box11 box12"
                "box13 box14 box15 box16 box17 box18"
                
            ;

        }
        .item{
            border: 2px solid rgb(249, 247, 247);
            background-color: #c6f90c;

        }
        #box1{
            grid-area:box1 ;
        }
        #box2{
            grid-area:box2 ;
        }
        #box3{
            grid-area:box3 ;
        }
        #box4{
            grid-area:box4 ;
        }
        #box5{
            grid-area:box5 ;
        }
        #box6{
            grid-area:box6 ;
        }
        #box7{
            grid-area:box7 ;
        }
        #box8{
            grid-area:box8 ;
        }
        #box9{
            grid-area:box9 ;
        }
        #box10{
            grid-area:box10 ;
        }
        #box11{
            grid-area:box11 ;
        }
        #box12{
            grid-area:box12 ;
        }
        #box13{
            grid-area:box13 ;
        }
        #box14{
            grid-area:box14 ;
        }
        #box15{
            grid-area:box15 ;
        } 
        #box16{
            grid-area:box16 ;
        }
        #box17{
            grid-area:box17 ;
        }
        #box18{
            grid-area:box18 ;
        }
       

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="box1"></div>
        <div class="item" id="box2"></div>
        <div class="item" id="box3"></div>
        <div class="item" id="box4"></div>
        <div class="item" id="box5"></div>
        <div class="item" id="box6"></div>
        <div class="item" id="box7"></div>
        <div class="item" id="box8"></div>
        <div class="item" id="box9"></div>
        <div class="item" id="box10"></div>
        <div class="item" id="box11"></div>
        <div class="item" id="box12"></div>
        <div class="item" id="box13"></div>
        <div class="item" id="box14"></div>
        <div class="item" id="box15"></div>
        <div class="item" id="box16"></div>
        <div class="item" id="box17"></div>
        <div class="item" id="box18"></div>
       
    </div>
</body>
</html>
