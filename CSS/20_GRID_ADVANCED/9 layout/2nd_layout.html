<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #4d4b4b;
            padding: 2rem;
            gap: 2rem;
            display: grid;
            grid-template-areas: 
                "box1 box1 box2"
                "box3 box4 box2"
            ;

        }
        .item{
            border: 2px solid rgb(249, 247, 247);
            background-color: #e40909;

        }
        #box1{
            grid-area:box1 ;
        }
        #box2{
            grid-area:box2 ;
        }
        #box3{
            grid-area:box3 ;
        }
        #box4{
            grid-area:box4 ;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="box1"></div>
        <div class="item"id="box2"></div>
        <div class="item"id="box3"></div>
        <div class="item"id="box4"></div>
    </div>
</body>
</html>
