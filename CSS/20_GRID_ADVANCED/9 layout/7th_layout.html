<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #4d4b4b;
            padding: 2rem;
            gap: 1rem;
            display: grid;
            grid-template-areas: 
                "box1 box1 box1 box2 box2 box2"
                "box3 box3 box3 box4 box4 box4"
                "box3 box3 box3 box4 box4 box4"
                "box3 box3 box3 box4 box4 box4"
                "box3 box3 box3 box4 box4 box4"
            ;

        }
        .item{
            border: 2px solid rgb(249, 247, 247);
            background-color: #c6f90c;

        }
        #box1{
            grid-area:box1 ;
        }
        #box2{
            grid-area:box2 ;
        }
        #box3{
            grid-area:box3 ;
        }
        #box4{
            grid-area:box4 ;
        }
       #box4{
        /* height: 100%;
            width: 100%; */
            /* background-color: #e71515; */
            padding: 2rem;
            gap: 1rem;
            display: grid;
            grid-template-areas: 
                "box5 box5"
                "box6 box7"
            
            ;
       }
       .item1{
            border: 2px solid rgb(249, 247, 247);
            background-color: #b32006;
       }

       #box5{
            grid-area:box5 ;
        }
        #box6{
            grid-area:box6 ;
        }
        #box7{
            grid-area:box7 ;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="box1"></div>
        <div class="item" id="box2"></div>
        <div class="item" id="box3"></div>
        <div class="item"  id="box4">
             <div class="item1" id="box5"></div>
             <div class="item1" id="box6"></div>
             <div class="item1" id="box7"></div>
        </div>
        
       
    </div>
</body>
</html>
