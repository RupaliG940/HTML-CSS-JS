<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: #4d4b4b;
            padding: 2rem;
            gap: 1rem;
            display: grid;
            /* grid-template-columns: repeat(3,1fr);
            grid-template-rows: auto; */
            grid-template-areas: 
               "box1  box1  box2  box3"
               "box4  box5  box6 ."
               "box7  box7  box8  box9"
               "box7  box7  box10 ."
               "box11 box11 box11 box12"
            ;

        }
        .item{
            border: 2px solid rgb(249, 247, 247);
            background-color: #0cd9f9;

        }
        #box1{
            grid-area:box1 ;
        }
        #box2{
            grid-area:box2 ;
        }
        #box3{
            grid-area:box3 ;
        }
        #box4{
            grid-area:box4 ;
        }
        #box5{
            grid-area:box5 ;
        }
        #box6{
            grid-area:box6 ;
        }
        #box7{
            grid-area:box7 ;
        }
        #box8{
            grid-area:box8 ;
        }
        #box9{
            grid-area:box9 ;
        }
        #box10{
            grid-area:box10 ;
        }
        #box11{
            grid-area:box11 ;
        }
        #box12{
            grid-area:box12 ;
        }
      
       

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="box1"></div>
        <div class="item" id="box2"></div>
        <div class="item" id="box3"></div>
        <div class="item" id="box4"></div>
        <div class="item" id="box5"></div>
        <div class="item" id="box6"></div>
        <div class="item" id="box7"></div>
        <div class="item" id="box8"></div>
        <div class="item" id="box9"></div>
        <div class="item" id="box10"></div>
        <div class="item" id="box11"></div>
        <div class="item" id="box12"></div>
        
       
    </div>
</body>
</html>
