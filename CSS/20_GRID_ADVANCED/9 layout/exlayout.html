<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }
        .body{
            width: 100%;
            height: 100%;
           
        }
        .container{
            width: 100%;
            height: 100%;
            background-color: #c917ba;
            /* border: 2px solid black; */
            padding: 4rem;
            gap: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(200px, 250px));

            grid-template-areas: 
            
               "header header header"
               "sidebar content1 content1"
               "sidebar content2 content3"
               "footer footer footer"
            ;

        }
        .item{
            background-color: #1266a2;
            border: 2px solid black;
            color: white;
            padding: 1rem;
            /* display: flex;
            justify-content: center;
            align-items: center; */
        }
        #header{
            grid-area:header ;
        }
        #sidebar{
            grid-area:sidebar ;
        }
        #content1{
            grid-area:content1 ;
        }
        #content2{
            grid-area:content2 ;
        }
        #content3{
            grid-area:content3 ;
        }
        #footer{
            grid-area:footer;
        }
</style>
</head>
<body>
    <div class="container">
        <div class="item" id="header">header</div>
        <div class="item"  id="sidebar">sidebar</div>
        <div class="item" id="content1">content1</div>
        <div class="item" id="content2">content2</div>
        <div class="item" id="content3">content3</div>
        <div class="item" id="footer">footer</div>
      
    </div>
</body>
</html>
