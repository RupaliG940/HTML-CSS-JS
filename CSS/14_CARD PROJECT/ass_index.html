<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD</title>
    <style>
        *{
    margin: 0px;
    padding: 0px;
    box-sizing:border-box ;
}

.container{
    height: 100vh;
    width: 100vw;
    background-color: #a7bfd2;
    display: flex;
    justify-content: center;
    align-items: center;
    
}

.card{
    width: 400px;
    height: 600px;
    border-radius: 20px;
    background-color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
   
}
.card img{
   width: 100%;
    height: 30%;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
}
.textbox{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 20px;
    width: 75%;


}
.amountbox{

    height: 60px;
    width: 300px;
    background-color: #c7f2f1;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: row;
    align-items: center;
   justify-content: space-between;
    

}
.amountbox #leftbox{
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 20px;

}
.amountbox img{
    width: 30px;
    height: 20%;
    
    
}
.button{

    height: 40px;
    width: 300px;
    background-color: rgb(3, 3, 40);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    box-shadow: 0px 5px 10px rgb(3, 3, 40) ;
}
#payment{
    background-color: #161755;
    color: white;
    width: 80%;
    height: 9%;
    border-radius: 10px;
    box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);

}
.canclebox a{
    text-decoration: none;
    color: #262a2cde;
    font-weight: bolder;
    font-size: larger;


}

    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="card">
                
                    <img src="https://thumbs.dreamstime.com/z/computer-network-
                    internet-communication-technology-background-d-rendering-global-
                    communication-computers-connected-globe-127354210.jpg" alt="network" height="100px"
                    width="250px">
                
                    <div class="textbox">
                        <h2>
                            Order Summary
                        </h2>
                        <p>
                            Lorem ipsum dolor sit amet consectetur adipisicing elit. Facilis quam fuga aliquam
                             excepturi nam incidunt illum deleniti. Quaerat nam sapiente 
                        </p>
                       
                    </div>
                    
                    <div class="amountbox">
                        <div id="leftbox">
                            <div id="item1">
                                <img src="singing.webp" alt="music">  
                            </div>
                            <div id="item2">
                                <p>Annual Plan</p>
                                <p>$99.9/year</p>
                            </div>
                            
                           

                        </div>
                        <div id="rightbox">
                            <a href="#">Change</a>

                        </div>
                        
                        
                    
                     </div>
                    <button id="payment">
                     Processed to payment
                    </button>
                      <div class="canclebox">
                     <a href="#">Cancle Order</a>
</div>
    </main>
</body>
</html>
