<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 300px;
            width: 500px;
            border: 1px solid black;
            background-color: chartreuse;
            display: flex;
            flex-direction: row;
            justify-content: center;
            
            
        }
        .box1{
            height: 200px;
            width: 200px;
            background-color: pink;
            border: 1px solid black;
            margin: 3px;
            padding: 2px;
            flex-direction: column;

        }
        .box2{
            height: 200px;
            width: 200px;
            background-color: pink;
            border: 1px solid black;
            margin: 3px;
            padding: 2px;
            
           
        }
        #img{
            border: 1px solid black;
           
        }

        .text1{
            height: 70px;
            width: 70px;
            background-color: rgb(5, 5, 232);
            border: 1px solid black;
            margin: 3px;
            padding: 2px;
           
        }
        .text2{
            height: 70px;
            width: 70px;
            background-color: rgb(73, 7, 255);
            border: 1px solid black;
            margin: 3px;
            padding: 2px;
           
        }
        @media (max-size:640px) {
        
        .container{
            flex-direction:column;
        }
            
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            <div class="text1">text1</div>
            <div class="text2">text2</div>
        </div>
        <div class="box2">
            <img id="img" src="Rose.jpg" alt="Rose" height="100px" width="100px">
        </div>
    </div>
</body>
</html>
