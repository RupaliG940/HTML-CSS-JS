<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
  <style>
    .class{
     
      border: 5px solid black;
      
      display: flex;
    }
      .box{
        height: 100px;
        width: 100px;
        background-color: black;
        border: 2px solid red;
        margin: 8px;
      }
      @media (min-width:640px) {
        .class{
            flex-direction: row;
        }
      }
      @media (max-width:640px)
       {
        .class{
          flex-direction: column;
        }
      }
      
  </style>
<body>
    <div class="class">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
