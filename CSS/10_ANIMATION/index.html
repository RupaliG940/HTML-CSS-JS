<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .container{
            background-color: blue;
            border: 4px solid black;
            width: 1500px;
            height: 700px;
            /* border-radius: 20px; */
            margin: 0px;
            padding: 0px;
            

        }
        .box{
            background-color: crimson;
            border: 3px solid black;
            width: 200px;
            height: 100px;
            margin: 20px;
            border-radius: 20px;
            position: relative;
            animation-name: rightMovement;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-fill-mode: both;
        }
        @keyframes rightMovement{
            from{
                top: 0;
                left: 0;
            }
            to{
                top: 0px;
                left: 1200px;
            }
        }
       

        .circle{
            background-color: crimson;
            border: 3px solid black;
            width: 100px;
            height: 100px;
            margin: 20px;
            border-radius: 100px;
            position: relative;
            /* animation-name: circle;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-timing-function: alternate;
            animation-direction: alternate;
            animation-fill-mode: both; */
            animation: 6s ease-in 1s infinite alternate none running circle;
        }
        @keyframes circle{
            0%{
                top:1%;
                left: 5%;
            }
            20%{
                top: 5%;
                left: 90%;
            }
            40%{
                
                top: 95%;
                left: 90%;
            }
            70%{
                
                top: 95%;
                left: 90%;
            }
        }
        .box2{
            background-color: crimson;
            border: 3px solid black;
            width: 200px;
            height: 100px;
            margin: 20px;
            border-radius: 20px;
            position: relative;
            animation-name: leftMovement;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate-reverse;
            animation-fill-mode: both;
        }
        @keyframes leftMovement{
            from{
                top:250px;
                left: 0;
            }
            to{
                top: 250px;
                left: 1200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
        <div class="circle">

        </div>
        <div class="box2">

        </div>

    </div>
</body>
</html>
