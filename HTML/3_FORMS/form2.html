<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Application</h1>
    
    <label for="Name">Name:</label>
    <br>
    <input type="text" name="Name" id="Name">
    <br>
    <br>
    <label for="Email">Email:</label>
    <br>
    <input type="text" name="Email" id="Email">
    <br>
    <br>
    <label for="phoneno">Phone:</label>
    <br>
    <input type="tel" name="phoneno" id="phoneno">
    <br>
    <br>
    <label for="Resume">Resume:</label>
    <br>
    <input type="file" name="Resume" id="Resume">
    <br>
    <br>
    <label for="Experince">Experince(year):</label>
    <br>
    <input type="number" name="Experince" id="Experince" max="50" min="0" >
    <br>
    <br>
    <fieldset>
        <legend>Skill</legend>
        <input type="checkbox" name="HTML" id="HTML">
        
        <label for="HTML">HTML</label>
        
        
        <input type="checkbox" name="CSS" id="CSS">
        
        <label for="CSS">CSS</label>
        
        
        <input type="checkbox" name="Javascript" id="Javascript">
        
        <label for="Javascript">Javascript</label>
        <br>
        <br>
    
    </fieldset>
    <label for="Highest Education">Highest Education:</label>
    <br>
    <select name="Highest Education" id="Highest Education">
      <option value="Primary Education">Primary Education</option>
      <option value="High School">High School</option>  
      <option value="collage">Collage</option>
      <option value="Degree">Degree</option>
      <option value="Other">Other</option>
    </select>
    <br>
    <br>
    <fieldset>
    <legend>Availibility:</legend>
        
    <input type="radio" name="Full-Time" id="Full-Time">
    <label for="Full-Time">Full Time</label>
    
    <input type="radio" name="Part-Time" id="Part-Time">
    <label for="Part-Time">Part-Time</label>
    </fieldset>
    <br>
    <br>
    <label for="Additional Commments">Additional Comments:</label>
    <br>
    <textarea name="Additional Commments" id="Additional Commments" cols="90" rows="3"> </textarea>
    <br>
    <button>submit Application</button>




</body>
</html>
