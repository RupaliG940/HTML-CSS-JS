<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Complex Form</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="Name">Name:</label>
        <input type="text" name="Name" id="Name">

        <label for="Email">Email:</label>
        <input type="text" name="Email" id="Email">

        <label for="Phone">Phone:</label>
        <input type="tel" name="Phone" id="Phone">

        <label for="date">Date:</label>
        <input type="date" name="date" id="date">
        <p>Gender</p>
        <label for="Gender1">Male</label>
        <input type="radio" name="Gender1" id="Gender1">

        <label for="Gender2">Female:</label>
        <input type="radio" name="Gender2" id="Gender2">

        <label for="Country">Country:</label>
        <select name="Country" id="Country">
            <option value="United State">United State</option>
            <option value="India">India</option>
            <option value="Japan">Japan</option>
            <option value="China">China</option>
        </select>
    </fieldset>
    <br>
        <fieldset>
            <legend>
                <label for="Address Street">Address Street</label>
                <input type="text" name="Address Street" id="Address Street">

                <label for="City">City:</label>
                <input type="text" name="City" id="City">

                <label for="State">State:</label>
                <input type="text" name="State" id="State">


                <label for="Zipcode">Zipcode:</label>
                <input type="text" name="Zipcode" id="Zipcode">
            </legend>
        </fieldset>
        <fieldset>
            <legend>Other Information</legend>
            <label for="Comments">Comments:</label>
            <textarea name="Commments" id="Commments" cols="60" rows="4"></textarea>

            <label for="checkbox">I agree to the Terms of Services:</label>
                <input type="checkbox" name="checkbox" id="checkbox">

        </fieldset>
        <button>submit</button>





    
</body>
</html>
