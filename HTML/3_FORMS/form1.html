<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Event Registration</h1>
    <br>
    <br>
    <label for="name">Name:</label>
    <br>
    <br>
    <input type="text" name="name" id="name">
    <br>
    <br>
    <label for="email">Email:</label>
    <br>
    <br>
    <input type="text" name="email" id="email">
    <br>
    <br>
    <label for="phoneno.">Phone:</label>
    <br>
    <br>
    <input type="tel" name="phoneno" id="phoneno">
    <br>
    <br>
    <label for="occupation">Occupation:</label>
    <br>
    <br>
    <select name="occupation" id="occupation">
        <option value="Former">Former</option>
        <option value="Teacher">Teacher</option>
        <option value="Doctor">Doctor</option>
        <option value="Businessman">Bussinesman</option>
        <option value="Other">Other</option>
    </select>
    <br>
    <br>
    <p>Topic of Interest:</p>
    <input type="checkbox" name="HTML" id="HTML">
    <label for="HTML">HTML</label>
    <br>
    <br>
    <input type="checkbox" name="CSS" id="CSS">
    <label for="CSS">CSS</label>
    <br>
    <br>
    <input type="checkbox" name="Javascript" id="Javascript">
    <label for="Javascript">Javascript</label>
    <br>
    <br>
    <label for="Comments">Comments:</label>
    <br>
    <br>
    <textarea name="Comments" id="Comments" cols="50" rows="5"></textarea>
    <input type="submit"value="Register">
    




</body>
</html>
